services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./hustlehub-plus/backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 5443
      TRUST_PROXY: "1"
      MONGODB_URI_ATLAS: ""
      MONGODB_URI_LOCAL: mongodb://mongo:27017/hustlehub
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_ISSUER: hustlehub-plus
      JWT_AUDIENCE: hustlehub-api
      CORS_ORIGINS: https://localhost:8443
    networks: [backend-net, frontend-net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  client:
    build: ./hustlehub-plus/frontend
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8443:8443"
      - "8080:8080"
    networks: [frontend-net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backend-net: { internal: true }
  frontend-net: {}

volumes:
  mongo-data: